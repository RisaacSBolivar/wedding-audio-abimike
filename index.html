<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abigail & Miguel – Nuestra Canción</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --gold: #c9a96e;
      --gold-light: #e8d5a3;
      --rose: #d4a0a0;
      --rose-dark: #9e6b6b;
      --cream: #fdf6ee;
      --dark: #2c1f1f;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden; /* Previene barras de scroll en el iframe */
    }

    body {
      font-family: 'Lato', sans-serif;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .player-card {
      background: transparent;
      border: none;
      border-radius: 20px;
      padding: 28px 24px 24px;
      width: 100%;
      max-width: 520px;
      box-shadow: none;
      position: relative;
      overflow: hidden;
    }

    .player-card::before,
    .player-card::after {
      display: none;
    }

    .player-header {
      display: none;
    }

    .waveform-container {
      position: relative;
      width: 100%;
      height: 80px;
      margin: 16px 0;
      cursor: pointer;
      border-radius: 8px;
      overflow: hidden;
    }

    #waveformCanvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 8px;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 0 2px;
    }

    .time-display {
      font-size: 11px;
      color: rgba(201, 169, 110, 0.6);
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
    }

    .progress-bar-container {
      flex: 1;
      height: 3px;
      background: rgba(201, 169, 110, 0.15);
      border-radius: 2px;
      margin: 0 12px;
      cursor: pointer;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #97532B;
      border-radius: 2px;
      transition: width 0.1s linear;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, opacity 0.15s ease;
      color: #97532B;
      opacity: 0.7;
      padding: 8px;
      border-radius: 50%;
    }

    .btn:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-play {
      width: 58px;
      height: 58px;
      background: #97532B;
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(151, 83, 43, 0.3), 0 8px 24px rgba(151, 83, 43, 0.2);
      opacity: 1;
      color: #ffffff;
    }

    .btn-play:hover {
      transform: scale(1.08);
      box-shadow: 0 0 0 1px rgba(151, 83, 43, 0.5), 0 12px 32px rgba(151, 83, 43, 0.35);
      opacity: 1;
    }

    .btn-play svg {
      width: 24px;
      height: 24px;
      fill: #ffffff;
    }

    .btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .volume-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 90px;
      height: 3px;
      background: rgba(201, 169, 110, 0.2);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: var(--gold);
      border-radius: 50%;
      box-shadow: 0 0 4px rgba(201, 169, 110, 0.5);
    }

    .volume-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      background: var(--gold);
      border-radius: 50%;
      border: none;
    }

    .upload-zone {
      border: 1px dashed rgba(201, 169, 110, 0.3);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 18px;
    }

    .upload-zone:hover {
      border-color: rgba(201, 169, 110, 0.6);
      background: rgba(201, 169, 110, 0.05);
    }

    .upload-zone.drag-over {
      border-color: var(--gold);
      background: rgba(201, 169, 110, 0.08);
    }

    .upload-zone p {
      font-size: 12px;
      color: rgba(201, 169, 110, 0.5);
      margin-top: 8px;
    }

    .upload-zone svg {
      width: 28px;
      height: 28px;
      fill: rgba(201, 169, 110, 0.4);
    }

    #fileInput {
      display: none;
    }

    .loading-bars {
      display: none;
      gap: 3px;
      align-items: flex-end;
      justify-content: center;
      height: 80px;
    }

    .loading-bars.active {
      display: flex;
    }

    .loading-bar {
      width: 4px;
      background: var(--gold);
      border-radius: 2px;
      animation: loadingPulse 1s ease-in-out infinite;
    }

    @keyframes loadingPulse {

      0%,
      100% {
        height: 10px;
        opacity: 0.3;
      }

      50% {
        height: 40px;
        opacity: 1;
      }
    }

    .loading-bar:nth-child(2) {
      animation-delay: 0.1s;
    }

    .loading-bar:nth-child(3) {
      animation-delay: 0.2s;
    }

    .loading-bar:nth-child(4) {
      animation-delay: 0.3s;
    }

    .loading-bar:nth-child(5) {
      animation-delay: 0.2s;
    }

    .loading-bar:nth-child(6) {
      animation-delay: 0.1s;
    }

    .notification {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(201, 169, 110, 0.15);
      border: 1px solid rgba(201, 169, 110, 0.3);
      color: var(--gold-light);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 11px;
      letter-spacing: 1px;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      white-space: nowrap;
    }

    .notification.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 400px) {
      .player-card {
        padding: 20px 16px 18px;
      }

      .btn-play {
        width: 52px;
        height: 52px;
      }

      .controls {
        gap: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="player-card" id="playerCard">

    <div class="player-header">
      <div class="song-ornament">♪ &nbsp; Nuestra Canción &nbsp; ♪</div>
      <div class="song-title" id="songTitle">Cargando...</div>
      <div class="song-artist" id="songArtist">Abigail &amp; Miguel</div>
    </div>

    <div class="waveform-container" id="waveformContainer" style="display:none;">
      <canvas id="waveformCanvas"></canvas>
    </div>

    <div class="loading-bars" id="loadingBars">
      <div class="loading-bar"></div>
      <div class="loading-bar"></div>
      <div class="loading-bar"></div>
      <div class="loading-bar"></div>
      <div class="loading-bar"></div>
      <div class="loading-bar"></div>
    </div>

    <div class="time-row" id="timeRow" style="display:none;">
      <span class="time-display" id="currentTime">0:00</span>
      <div class="progress-bar-container" id="progressBarContainer">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
      <span class="time-display" id="totalTime">0:00</span>
    </div>

    <div class="controls" id="controls" style="display:none;">
      <button class="btn" id="btnRewind" title="Retroceder">
        <svg viewBox="0 0 24 24">
          <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
        </svg>
      </button>

      <button class="btn btn-play" id="btnPlay" title="Reproducir">
        <svg id="iconPlay" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z" />
        </svg>
        <svg id="iconPause" viewBox="0 0 24 24" style="display:none;">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
        </svg>
      </button>

      <button class="btn" id="btnForward" title="Adelantar">
        <svg viewBox="0 0 24 24">
          <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
        </svg>
      </button>
    </div>

    <div class="volume-row" id="volumeRow" style="display:none;">
      <svg viewBox="0 0 24 24" fill="rgba(201,169,110,0.5)" style="width:16px;height:16px;">
        <path
          d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5zm7-.17v6.34L9.83 13H7v-2h2.83L12 8.83z" />
      </svg>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" />
      <svg viewBox="0 0 24 24" fill="rgba(201,169,110,0.5)" style="width:16px;height:16px;">
        <path
          d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.97z" />
      </svg>
    </div>

    <div class="upload-zone" id="uploadZone">
      <svg viewBox="0 0 24 24">
        <path
          d="M12 3l-5.5 9h11L12 3zm0 3.84L14.93 11h-5.87L12 6.84zM17.5 13c-2.49 0-4.5 2.01-4.5 4.5S15.01 22 17.5 22s4.5-2.01 4.5-4.5S19.99 13 17.5 13zm2.5 5h-2v2h-1v-2h-2v-1h2v-2h1v2h2v1zM11 13.5V22H3v-8.5h8zm-1.5 1.5h-5v5h5v-5z" />
      </svg>
      <p>Haz clic o arrastra tu archivo de música aquí</p>
      <p style="margin-top:4px;font-size:10px;opacity:0.6;">MP3, WAV, OGG, M4A</p>
      <input type="file" id="fileInput" accept="audio/*" />
    </div>

    <div class="notification" id="notification"></div>
  </div>

  <script>
    (function () {
      'use strict';

      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      // 🎵 CONFIGURACIÓN — Edita estos tres valores
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      var SONG_URL = 'Todo tiene su hora.mp3';      // ← nombre de tu archivo de audio
      var SONG_TITLE = 'Nuestra Canción';      // ← título que se mostrará
      var SONG_ARTIST = 'Abigail & Miguel';     // ← nombre de los novios
      // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      const uploadZone = document.getElementById('uploadZone');
      const fileInput = document.getElementById('fileInput');
      const waveformCont = document.getElementById('waveformContainer');
      const canvas = document.getElementById('waveformCanvas');
      const ctx2d = canvas.getContext('2d');
      const loadingBars = document.getElementById('loadingBars');
      const timeRow = document.getElementById('timeRow');
      const controlsEl = document.getElementById('controls');
      const volumeRow = document.getElementById('volumeRow');
      const btnPlay = document.getElementById('btnPlay');
      const iconPlay = document.getElementById('iconPlay');
      const iconPause = document.getElementById('iconPause');
      const btnRewind = document.getElementById('btnRewind');
      const btnForward = document.getElementById('btnForward');
      const currentTimeEl = document.getElementById('currentTime');
      const totalTimeEl = document.getElementById('totalTime');
      const progressFill = document.getElementById('progressBarFill');
      const progressCont = document.getElementById('progressBarContainer');
      const volumeSlider = document.getElementById('volumeSlider');
      const songTitle = document.getElementById('songTitle');
      const notification = document.getElementById('notification');

      let audioCtx, analyser, source, audioElement;
      let isPlaying = false;
      let animFrameId = null;
      let notifTimer = null;

      function formatTime(secs) {
        if (!secs || isNaN(secs)) return '0:00';
        const m = Math.floor(secs / 60);
        const s = Math.floor(secs % 60);
        return m + ':' + s.toString().padStart(2, '0');
      }

      function showNotif(msg) {
        notification.textContent = msg;
        notification.classList.add('show');
        clearTimeout(notifTimer);
        notifTimer = setTimeout(() => notification.classList.remove('show'), 2500);
      }

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx2d.scale(dpr, dpr);
        ctx2d.clearRect(0, 0, rect.width, rect.height);
        
        // Línea base elegante
        ctx2d.beginPath();
        ctx2d.moveTo(0, rect.height / 2);
        ctx2d.lineTo(rect.width, rect.height / 2);
        ctx2d.strokeStyle = 'rgba(151, 83, 43, 0.2)';
        ctx2d.lineWidth = 2;
        ctx2d.stroke();
      }

      window.addEventListener('resize', resizeCanvas);

      function drawLiveWaveform() {
        if (!audioElement) return;
        animFrameId = requestAnimationFrame(drawLiveWaveform);

        const progress = audioElement.currentTime / (audioElement.duration || 1);
        currentTimeEl.textContent = formatTime(audioElement.currentTime);
        progressFill.style.width = (progress * 100) + '%';

        if (analyser) {
          // Análisis real de frecuencia (funciona en servidores http://)
          const W = canvas.getBoundingClientRect().width;
          const H = canvas.getBoundingClientRect().height;
          
          ctx2d.clearRect(0, 0, W, H);
          
          // Línea base elegante
          ctx2d.beginPath();
          ctx2d.moveTo(0, H / 2);
          ctx2d.lineTo(W, H / 2);
          ctx2d.strokeStyle = 'rgba(151, 83, 43, 0.2)';
          ctx2d.lineWidth = 2;
          ctx2d.stroke();
          
          const bufLen = analyser.frequencyBinCount;
          const freqData = new Uint8Array(bufLen);
          analyser.getByteFrequencyData(freqData);

          const barCount = Math.min(80, Math.floor(W / 3));
          const step = Math.floor(bufLen / barCount);
          const barW = (W / barCount) * 0.55;
          const gap = (W / barCount) * 0.45;

          for (let i = 0; i < barCount; i++) {
            const val = freqData[i * step] / 255;
            if (val < 0.05) continue;
            const barH = val * H * 0.6;
            const x = i * (barW + gap);
            const y = (H - barH) / 2;
            ctx2d.fillStyle = 'rgba(151, 83, 43, ' + (val * 0.35) + ')';
            ctx2d.beginPath();
            if (ctx2d.roundRect) {
              ctx2d.roundRect(x, y, barW, barH, barW / 2);
            } else {
              ctx2d.rect(x, y, barW, barH);
            }
            ctx2d.fill();
          }
        }
      }



      function setupAudio(url, bypassWebAudio = false) {
        if (audioElement) { audioElement.pause(); audioElement.src = ''; }
        if (animFrameId) cancelAnimationFrame(animFrameId);
        if (audioCtx) { audioCtx.close(); audioCtx = null; analyser = null; }

        audioElement = new Audio();
        audioElement.src = url;
        audioElement.volume = parseFloat(volumeSlider.value);

        if (!bypassWebAudio) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            analyser.smoothingTimeConstant = 0.8;
            source = audioCtx.createMediaElementSource(audioElement);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
        }

        audioElement.addEventListener('loadedmetadata', function () {
          totalTimeEl.textContent = formatTime(audioElement.duration);
        });

        audioElement.addEventListener('ended', function () {
          isPlaying = false;
          iconPlay.style.display = 'block';
          iconPause.style.display = 'none';
          cancelAnimationFrame(animFrameId);
          if (canvas) {
            resizeCanvas();
          }
        });
      }

      function handleFile(file) {
        if (!file || !file.type.startsWith('audio/')) {
          showNotif('Por favor selecciona un archivo de audio');
          return;
        }
        const name = file.name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
        songTitle.textContent = name;

        const url = URL.createObjectURL(file);
        setupAudio(url, false);
        
        loadingBars.classList.remove('active');
        waveformCont.style.display = 'block';
        timeRow.style.display = 'flex';
        controlsEl.style.display = 'flex';
        volumeRow.style.display = 'flex';
        uploadZone.style.display = 'none';
        resizeCanvas();
      }

      uploadZone.addEventListener('click', function () { fileInput.click(); });
      fileInput.addEventListener('change', function (e) { handleFile(e.target.files[0]); });
      uploadZone.addEventListener('dragover', function (e) { e.preventDefault(); uploadZone.classList.add('drag-over'); });
      uploadZone.addEventListener('dragleave', function () { uploadZone.classList.remove('drag-over'); });
      uploadZone.addEventListener('drop', function (e) {
        e.preventDefault();
        uploadZone.classList.remove('drag-over');
        handleFile(e.dataTransfer.files[0]);
      });

      btnPlay.addEventListener('click', function () {
        if (!audioElement) return;
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

        if (isPlaying) {
          audioElement.pause();
          cancelAnimationFrame(animFrameId);
          isPlaying = false;
          iconPlay.style.display = 'block';
          iconPause.style.display = 'none';
        } else {
          audioElement.play().catch(function () {
            showNotif('Haz clic en la página primero para activar el audio');
          });
          isPlaying = true;
          iconPlay.style.display = 'none';
          iconPause.style.display = 'block';
          drawLiveWaveform();
        }
      });

      btnRewind.addEventListener('click', function () {
        if (audioElement) audioElement.currentTime = Math.max(0, audioElement.currentTime - 10);
      });

      btnForward.addEventListener('click', function () {
        if (audioElement) audioElement.currentTime = Math.min(audioElement.duration, audioElement.currentTime + 10);
      });

      function seekFromEvent(e, container) {
        const rect = container.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
        if (audioElement) audioElement.currentTime = ratio * audioElement.duration;
      }

      progressCont.addEventListener('click', function (e) { seekFromEvent(e, progressCont); });
      progressCont.addEventListener('touchstart', function (e) { e.preventDefault(); seekFromEvent(e, progressCont); }, { passive: false });

      waveformCont.addEventListener('click', function (e) { seekFromEvent(e, waveformCont); });
      waveformCont.addEventListener('touchstart', function (e) { e.preventDefault(); seekFromEvent(e, waveformCont); }, { passive: false });

      volumeSlider.addEventListener('input', function () {
        if (audioElement) audioElement.volume = parseFloat(volumeSlider.value);
      });

      // ── Auto-carga la canción precargada al iniciar ──────────────────
      (function autoLoad() {
        document.getElementById('songTitle').textContent = SONG_TITLE;
        document.getElementById('songArtist').textContent = SONG_ARTIST;

        if (!SONG_URL) {
          document.getElementById('songTitle').textContent = 'Carga tu canción';
          return;
        }

        uploadZone.style.display = 'none';
        loadingBars.classList.add('active');

        function showPlayerUI() {
          loadingBars.classList.remove('active');
          waveformCont.style.display = 'block';
          timeRow.style.display = 'flex';
          controlsEl.style.display = 'flex';
          volumeRow.style.display = 'flex';
          resizeCanvas();
        }



        // Usar método HEAD para checar si hay error CORS (file://) sin descargar la pista completa
        fetch(SONG_URL, { method: 'HEAD' })
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            setupAudio(SONG_URL, false);
            showPlayerUI();
          })
          .catch(function () {
            // fetch falla en protocolo file:// — usar patrón de respaldo y mostrar controles
            setupAudio(SONG_URL, true);
            showPlayerUI();
          });
      })();

    })();
  </script>

</body>

</html>
